services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto_broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT sobre WebSockets (reservado)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Panel de administracion
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  fleet-monitor:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"     # API REST
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      rabbitmq:
        condition: service_healthy

  puente:
    build: ./mqtt
    command: ["python", "mqtt_rabbitmq_bridge.py"]
    restart: unless-stopped
    environment:
      MQTT_BROKER: mosquitto
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  simulador:
    build: ./mqtt
    command: ["python", "simulador_sensores.py"]
    restart: unless-stopped
    environment:
      MQTT_BROKER: mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy
      puente:
        condition: service_started

volumes:
  mosquitto_data:
  rabbitmq_data:
